<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal do Estudante - Autenticação</title>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --card-border: #333333;
      
      --text-primary: #f5f5f5;
      --text-secondary: #b0bec5;
      
      --primary-color: #2e7d32;
      --primary-hover: #388e3c;
      --primary-text: #ffffff;
      
      --error-color: #ff6b6b;
      --error-bg: rgba(255, 107, 107, 0.1);
      
      --focus-outline: #80d8ff;
      --font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-family);
      background-color: var(--bg-color);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 1rem;
    }

    .login-card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      width: 100%;
      max-width: 400px;
      padding: 2rem;
    }

    .login-card h1 {
      font-size: 1.5rem;
      text-align: center;
      color: var(--text-primary);
      margin-bottom: 1.5rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-bottom: 2px solid var(--primary-color);
      padding-bottom: 0.5rem;
    }

    .form-group {
      margin-bottom: 1.25rem;
      display: flex;
      flex-direction: column;
    }

    .form-group label {
      font-weight: 600;
      font-size: 0.9rem;
      margin-bottom: 0.4rem;
      color: var(--text-secondary);
    }

    .form-group input {
      padding: 0.75rem;
      font-size: 1rem;
      background-color: #2a2a2a;
      color: var(--text-primary);
      border: 1px solid var(--card-border);
      border-radius: 4px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .form-group input:focus {
      outline: 3px solid var(--focus-outline);
      border-color: var(--focus-outline);
    }

    .form-group input[aria-invalid="true"] {
      border-color: var(--error-color);
      background-color: var(--error-bg);
    }

    .error-message {
      color: var(--error-color);
      font-size: 0.85rem;
      font-weight: 600;
      margin-top: 0.4rem;
      display: none;
    }

    .error-message.active {
      display: block;
    }

    .btn-submit {
      width: 100%;
      padding: 0.85rem;
      background-color: var(--primary-color);
      color: var(--primary-text);
      border: none;
      border-radius: 4px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      margin-top: 0.5rem;
      transition: background-color 0.2s;
    }

    .btn-submit:hover {
      background-color: var(--primary-hover);
    }

    .btn-submit:focus-visible {
      outline: 3px solid var(--focus-outline);
    }

    .auth-link {
      display: block;
      text-align: center;
      margin-top: 1.25rem;
      font-size: 0.9rem;
      color: #81c784;
      text-decoration: underline;
      font-weight: 600;
    }

    .auth-link:hover {
      color: #a5d6a7;
    }

    .auth-link:focus-visible {
      outline: 3px solid var(--focus-outline);
      border-radius: 2px;
    }

    .demo-controls {
      margin-top: 2rem;
      padding: 0.75rem 1rem;
      background: #2a2a2a;
      border: 1px dashed var(--card-border);
      border-radius: 6px;
      font-size: 0.85rem;
      text-align: center;
      color: var(--text-secondary);
    }

    .demo-controls button {
      margin-top: 0.5rem;
      padding: 0.4rem 0.8rem;
      background: #333;
      color: var(--text-primary);
      border: 1px solid var(--card-border);
      border-radius: 4px;
      cursor: pointer;
    }

    .demo-controls button:hover {
      background: #444;
    }
  </style>
</head>
<body>

  <main class="login-card">
    <h1>Portal do Estudante</h1>

    <form id="loginForm" action="boletim.html" method="GET" novalidate>
      <div class="form-group">
        <label for="username">USUÁRIO</label>
        <input 
          type="text" 
          id="username" 
          name="username" 
          required 
          autocomplete="username"
          aria-required="true"
        >
        <span id="username-error" class="error-message" role="alert">
          USUÁRIO NÃO EXISTE NO SISTEMA.
        </span>
      </div>

      <div class="form-group">
        <label for="password">SENHA</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          required 
          autocomplete="current-password"
          aria-required="true"
        >
        <span id="password-error" class="error-message" role="alert">
          SENHA INCORRETA. TENTE NOVAMENTE.
        </span>
      </div>

      <button type="submit" class="btn-submit">FAZER LOGIN</button>
    </form>

    <a href="cadastro.html" class="auth-link">NÃO TEM CONTA? FAÇA CADASTRO!</a>
  </main>

  <aside class="demo-controls" aria-label="Controles de demonstração">
    <p><strong>Simulador de Estados do PDF:</strong></p>
    <button type="button" onclick="toggleErros()">Alternar Mensagens de Erro</button>
  </aside>

  <script>
    const form = document.getElementById('loginForm');
    const userInput = document.getElementById('username');
    const passInput = document.getElementById('password');
    const userError = document.getElementById('username-error');
    const passError = document.getElementById('password-error');

    form.addEventListener('submit', function(e) {
      if (userError.classList.contains('active')) {
        e.preventDefault();
        alert("Corrija os erros apontados antes de prosseguir.");
      }
    });

    function toggleErros() {
      const isErrorActive = userError.classList.contains('active');
      
      if (!isErrorActive) {
        userError.classList.add('active');
        passError.classList.add('active');
        userInput.setAttribute('aria-invalid', 'true');
        userInput.setAttribute('aria-describedby', 'username-error');
        passInput.setAttribute('aria-invalid', 'true');
        passInput.setAttribute('aria-describedby', 'password-error');
      } else {
        userError.classList.remove('active');
        passError.classList.remove('active');
        userInput.removeAttribute('aria-invalid');
        userInput.removeAttribute('aria-describedby');
        passInput.removeAttribute('aria-invalid');
        passInput.removeAttribute('aria-describedby');
      }
    }
  </script>

</body>
</html>
