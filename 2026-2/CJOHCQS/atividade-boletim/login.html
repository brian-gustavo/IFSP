<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal do Estudante - Autenticação</title>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --card-border: #333333;
      --text-primary: #f5f5f5;
      --text-secondary: #b0bec5;
      --primary-color: #2e7d32;
      --primary-hover: #388e3c;
      --primary-text: #ffffff;
      --error-color: #ff6b6b;
      --error-bg: rgba(255, 107, 107, 0.1);
      --focus-outline: #80d8ff;
      --font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-family);
      background-color: var(--bg-color);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 1rem;
    }

    .login-card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      width: 100%;
      max-width: 400px;
      padding: 2rem;
    }

    .login-card h1 {
      font-size: 1.5rem;
      text-align: center;
      color: var(--text-primary);
      margin-bottom: 1.5rem;
      text-transform: uppercase;
      border-bottom: 2px solid var(--primary-color);
      padding-bottom: 0.5rem;
    }

    .form-group {
      margin-bottom: 1.25rem;
      display: flex;
      flex-direction: column;
    }

    .form-group label {
      font-weight: 600;
      font-size: 0.9rem;
      margin-bottom: 0.4rem;
      color: var(--text-secondary);
    }

    .form-group input {
      padding: 0.75rem;
      font-size: 1rem;
      background-color: #2a2a2a;
      color: var(--text-primary);
      border: 1px solid var(--card-border);
      border-radius: 4px;
    }

    .form-group input.has-error {
      border-color: var(--error-color);
      background-color: var(--error-bg);
    }

    .form-group input:focus {
      outline: 3px solid var(--focus-outline);
      border-color: var(--focus-outline);
    }

    .error-message {
      color: var(--error-color);
      font-size: 0.85rem;
      font-weight: 600;
      margin-top: 0.4rem;
      display: none;
    }

    .btn-submit {
      width: 100%;
      padding: 0.85rem;
      background-color: var(--primary-color);
      color: var(--primary-text);
      border: none;
      border-radius: 4px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      margin-top: 0.5rem;
    }

    .btn-submit:hover { background-color: var(--primary-hover); }
    .btn-submit:focus-visible { outline: 3px solid var(--focus-outline); }

    .auth-link {
      display: block;
      text-align: center;
      margin-top: 1.25rem;
      font-size: 0.9rem;
      color: #81c784;
      text-decoration: underline;
      font-weight: 600;
    }
  </style>
</head>

<body>
  <main class="login-card">
    <h1>Portal do Estudante</h1>

    <form id="loginForm" novalidate>
      <div class="form-group">
        <label for="username">USUÁRIO</label>
        <input type="text" id="username" name="username" required autocomplete="username">
        <span id="username-error" class="error-message" role="alert">
          USUÁRIO NÃO EXISTE NO SISTEMA.
        </span>
      </div>

      <div class="form-group">
        <label for="password">SENHA</label>
        <input type="password" id="password" name="password" required autocomplete="current-password">
        <span id="password-error" class="error-message" role="alert">
          SENHA INCORRETA. TENTE NOVAMENTE.
        </span>
      </div>

      <button type="submit" class="btn-submit">FAZER LOGIN</button>
    </form>

    <a href="cadastro.html" class="auth-link">NÃO TEM CONTA? FAÇA CADASTRO!</a>
  </main>
  <script>
    const form = document.getElementById('loginForm');
    const userInput = document.getElementById('username');
    const passInput = document.getElementById('password');
    const userErr = document.getElementById('username-error');
    const passErr = document.getElementById('password-error');

    form.addEventListener('submit', function(e) {
      e.preventDefault();
      
      userInput.classList.remove('has-error');
      passInput.classList.remove('has-error');
      userErr.style.display = 'none';
      passErr.style.display = 'none';

      const userVal = userInput.value.trim();
      const passVal = passInput.value;

      const usuariosValidos = {
        "usuario1": "Senha123",
        "usuario2": "Senha456"
      };

      if (userVal === "usuario1" && passVal === "Senha123") {
        window.location.href = 'boletim.html';
      } else if (userVal === "usuario2" && passVal === "Senha456") {
        window.location.href = 'sem_informacoes.html';
      } else {
        const usuarioExiste = userVal in usuariosValidos;

        if (!usuarioExiste) {
          userInput.classList.add('has-error');
          userErr.style.display = 'block';
        }

        if (!usuarioExiste || usuariosValidos[userVal] !== passVal) {
          passInput.classList.add('has-error');
          passErr.style.display = 'block';
        }
      }
    });
  </script>
</body>
</html>
