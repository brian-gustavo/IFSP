<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal do Estudante - Sem Informações</title>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --card-border: #333333;
      --text-primary: #f5f5f5;
      --text-secondary: #b0bec5;
      --primary-color: #2e7d32;
      --primary-hover: #388e3c;
      --font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-family);
      background-color: var(--bg-color);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background-color: var(--card-bg);
      border-bottom: 2px solid var(--primary-color);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand-title {
      font-size: 1.25rem;
      font-weight: bold;
      text-transform: uppercase;
    }

    .btn-logout {
      background-color: transparent;
      border: 1px solid #ff6b6b;
      color: #ff6b6b;
      padding: 0.4rem 0.8rem;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
      font-size: 0.85rem;
    }

    main {
      flex: 1;
      max-width: 600px;
      width: 100%;
      margin: 4rem auto;
      padding: 0 1rem;
      text-align: center;
    }

    .empty-card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 3rem 2rem;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
    }

    .empty-card h1 {
      font-size: 1.4rem;
      margin-bottom: 1rem;
      color: var(--text-primary);
    }

    .empty-card p {
      color: var(--text-secondary);
      margin-bottom: 2rem;
    }

    .btn-primary {
      display: inline-block;
      background-color: var(--primary-color);
      color: #ffffff;
      padding: 0.85rem 1.5rem;
      border-radius: 4px;
      text-decoration: none;
      font-weight: bold;
      transition: background-color 0.2s;
    }

    .btn-primary:hover { background-color: var(--primary-hover); }
  </style>
</head>

<body>
  <header>
    <div class="brand-title">PORTAL DO ESTUDANTE</div>
    <a href="login.html" class="btn-logout">SAIR</a>
  </header>

  <main>
    <div class="empty-card">
      <h1>NENHUM BOLETIM ENCONTRADO</h1>
      <p>Você ainda não possui informações cadastradas para o período atual.</p>
      <a href="boletim.html" class="btn-primary">CRIAR BOLETIM</a>
    </div>
  </main>
</body>
</html>
