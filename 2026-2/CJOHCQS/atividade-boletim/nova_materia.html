<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal do Estudante - Cadastrar Matéria</title>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --card-border: #333333;
      --text-primary: #f5f5f5;
      --text-secondary: #b0bec5;
      --primary-color: #2e7d32;
      --primary-hover: #388e3c;
      --font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-family);
      background-color: var(--bg-color);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background-color: var(--card-bg);
      border-bottom: 2px solid var(--primary-color);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand-title { font-size: 1.25rem; font-weight: bold; text-transform: uppercase; }

    .btn-logout {
      background-color: transparent;
      border: 1px solid #ff6b6b;
      color: #ff6b6b;
      padding: 0.4rem 0.8rem;
      border-radius: 4px;
      font-weight: bold;
      text-decoration: none;
      font-size: 0.85rem;
    }

    main {
      flex: 1;
      max-width: 500px;
      width: 100%;
      margin: 3rem auto;
      padding: 0 1rem;
    }

    .form-card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 2rem;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
    }

    .form-card h1 {
      font-size: 1.3rem;
      margin-bottom: 1.5rem;
      text-transform: uppercase;
      border-bottom: 2px solid var(--primary-color);
      padding-bottom: 0.5rem;
    }

    .form-group {
      margin-bottom: 1.25rem;
      display: flex;
      flex-direction: column;
    }

    .form-group label {
      font-weight: 600;
      font-size: 0.9rem;
      margin-bottom: 0.4rem;
      color: var(--text-secondary);
    }

    .form-group input {
      padding: 0.75rem;
      font-size: 1rem;
      background-color: #2a2a2a;
      color: var(--text-primary);
      border: 1px solid var(--card-border);
      border-radius: 4px;
    }

    .btn-submit {
      width: 100%;
      padding: 0.85rem;
      background-color: var(--primary-color);
      color: #ffffff;
      border: none;
      border-radius: 4px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      margin-top: 0.5rem;
    }

    .btn-submit:hover { background-color: var(--primary-hover); }

    .btn-cancel {
      display: block;
      text-align: center;
      margin-top: 1rem;
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 0.9rem;
    }
  </style>
</head>

<body>
  <header>
    <div class="brand-title">PORTAL DO ESTUDANTE</div>
    <a href="login.html" class="btn-logout">SAIR</a>
  </header>

  <main>
    <div class="form-card">
      <h1>Cadastrar Nova Matéria</h1>

      <form action="boletim.html" method="GET">
        <div class="form-group">
          <label for="materia">NOME DA MATÉRIA</label>
          <input type="text" id="materia" name="materia" required placeholder="Ex: Informações da Matéria 5">
        </div>

        <div class="form-group">
          <label for="prof">NOME DO PROFESSOR</label>
          <input type="text" id="prof" name="prof" required placeholder="Ex: Prof. João Pedro">
        </div>

        <button type="submit" class="btn-submit">SALVAR MATÉRIA</button>
        <a href="boletim.html" class="btn-cancel">CANCELAR</a>
      </form>
    </div>
  </main>
</body>
</html>
